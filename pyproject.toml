[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing"
version = "2.4.0rc1"
description = "Modular real-time RF signal processing and feature extraction library for LTE-targeted SDR pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
acceleration = ["numba>=0.67,<0.68", "pyfftw>=0.15.1,<0.16", "psutil>=7,<8"]
pluto = ["pyadi-iio>=0.0.20,<0.1", "pylibiio>=0.25,<1"]
test = [
    "numba>=0.67,<0.68",
    "pyfftw>=0.15.1,<0.16",
    "psutil>=7,<8",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
ui = [
    "h5py>=3.10.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
rf-pipeline-ui = "signal_processing.ui.hdf5_app:main"
rf-lte-ui = "signal_processing.ui.lte_app:main"
rf-lte-sync = "signal_processing.lte.cli:main"
rf-adaptive = "signal_processing.runtime.adaptive_cli:main"
rf-pluto = "signal_processing.runtime.pluto_cli:main"


[tool.setuptools.packages.find]
include = ["signal_processing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
